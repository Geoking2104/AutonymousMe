name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.90"
  NODE_VERSION: "22"
  HOLOCHAIN_VERSION: "0.7.1"

jobs:
  # ???????????????? Rust: check + test zomes ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
  zomes:
    name: Zomes ???????? check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check (native, for IDE errors)
        run: cargo check --workspace

      - name: Unit tests
        run: cargo test --workspace

      - name: Check wasm32 compilation (0.6 requires the getrandom custom backend)
        run: cargo build --release --target wasm32-unknown-unknown --workspace
        env:
          RUSTFLAGS: '--cfg getrandom_backend="custom"'

      - name: Clippy lint
        run: cargo clippy --workspace -- -D warnings

  # ???????????????? JS: API + SDK + UI ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
  js:
    name: API / SDK / UI ???????? build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & test workspaces
        run: |
          npm run build --workspace api && npm test --workspace api
          npm run build --workspace sdk && npm test --workspace sdk
          npm run build --workspace ui

  # ???????????????? Pack hApp + web hApp bundles ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
  pack:
    name: Pack hApp & web hApp
    runs-on: ubuntu-latest
    needs: [zomes, js]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install holochain CLI ${{ env.HOLOCHAIN_VERSION }}
        run: |
          curl -L "https://github.com/holochain/holochain/releases/download/holochain-${{ env.HOLOCHAIN_VERSION }}/hc-x86_64-unknown-linux-gnu" -o /usr/local/bin/hc
          chmod +x /usr/local/bin/hc
          hc --version

      - name: Build zomes (wasm32, getrandom custom backend)
        run: cargo build --release --target wasm32-unknown-unknown --workspace
        env:
          RUSTFLAGS: '--cfg getrandom_backend="custom"'

      - name: Copy coordinator wasms (distinct paths required by hc dna pack)
        run: node scripts/copy-coordinator-wasms.mjs

      - name: Pack DNA (dnas/core is the canonical DNA)
        run: hc dna pack dnas/core/ --output dnas/core/core.dna

      - name: Pack hApp
        run: hc app pack . --output autonymous-me.happ

      - name: Build UI & pack web hApp
        run: |
          npm run build --workspace ui
          cd ui && zip -r dist.zip dist && cd ..
          hc web-app pack . --output autonymous-me.webhapp

      - name: Upload hApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonymous-me-happ
          path: autonymous-me.happ
          retention-days: 30

      - name: Upload web hApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonymous-me-webhapp
          path: autonymous-me.webhapp
          retention-days: 30

  # ???????????????? Security audit ????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  # -- Conductor e2e (live holochain 0.7.1) --
  conductor:
    name: Conductor e2e (live holochain 0.7.1)
    runs-on: ubuntu-latest
    needs: [pack, js]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install api dependencies
        run: npm ci && cd api && npm ci

      - name: Download hApp artifact
        uses: actions/download-artifact@v4
        with:
          name: autonymous-me-happ

      - name: Install holochain + hc ${{ env.HOLOCHAIN_VERSION }}
        run: |
          curl -L "https://github.com/holochain/holochain/releases/download/holochain-${{ env.HOLOCHAIN_VERSION }}/holochain-x86_64-unknown-linux-gnu" -o /usr/local/bin/holochain
          curl -L "https://github.com/holochain/holochain/releases/download/holochain-${{ env.HOLOCHAIN_VERSION }}/hc-x86_64-unknown-linux-gnu" -o /usr/local/bin/hc
          chmod +x /usr/local/bin/holochain /usr/local/bin/hc
          holochain --version

      # hc sandbox generate cannot run without a TTY (the conductor waits for
      # a lair passphrase on stdin), so we drive a persistent conductor
      # directly: create config, pin the admin port, start with --piped.
      - name: Start conductor (piped passphrase, fixed admin port)
        run: |
          cd /tmp && holochain --create-config
          sbx=$(dirname "$(find /tmp -maxdepth 2 -name conductor-config.yaml | sort | tail -1)")
          echo "sandbox dir: $sbx"
          sed -i 's/port: 0/port: 9100/' "$sbx/conductor-config.yaml"
          echo pass | nohup holochain --piped -c "$sbx/conductor-config.yaml" > /tmp/conductor.log 2>&1 &
          for i in $(seq 1 30); do
            grep -q 'Conductor ready' /tmp/conductor.log && break
            sleep 1
          done
          grep -q 'Conductor ready' /tmp/conductor.log || { cat /tmp/conductor.log; exit 1; }

      - name: Run 13-check end-to-end verification (install, enable & zome calls over websockets)
        run: node api/scripts/verify-conductor-07.mjs
        env:
          ADMIN_WS_URL: ws://localhost:9100
          APP_WS_URL: ws://localhost:9000
          HAPP_PATH: ${{ github.workspace }}/autonymous-me.happ
        timeout-minutes: 5
  # -- Multi-agent Tryorama scenario --
  tryorama:
    name: Tryorama (2 agents, mem network)
    runs-on: ubuntu-latest
    needs: [pack]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download hApp artifact
        uses: actions/download-artifact@v4
        with:
          name: autonymous-me-happ

      - name: Install holochain, hc & kitsune2-bootstrap-srv 0.7.1
        run: |
          base="https://github.com/holochain/holochain/releases/download/holochain-0.7.1"
          curl -L "$base/holochain-x86_64-unknown-linux-gnu" -o /usr/local/bin/holochain
          curl -L "$base/hc-x86_64-unknown-linux-gnu" -o /usr/local/bin/hc
          curl -L "$base/kitsune2-bootstrap-srv-x86_64-unknown-linux-gnu" -o /usr/local/bin/kitsune2-bootstrap-srv
          chmod +x /usr/local/bin/holochain /usr/local/bin/hc /usr/local/bin/kitsune2-bootstrap-srv
          holochain --version

      - name: Install test dependencies
        run: npm ci && cd tests && npm ci

      - name: Run 2-agent scenario
        run: npm test --workspace tests
        env:
          HAPP_PATH: ${{ github.workspace }}/autonymous-me.happ
        timeout-minutes: 8
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.77"
  NODE_VERSION: "20"
  HOLOCHAIN_VERSION: "0.4.1"

jobs:
  # ── Rust: check + test zomes ──────────────────────────────────────────────
  zomes:
    name: Zomes — check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check (native, for IDE errors)
        run: cargo check --workspace

      - name: Unit tests
        run: cargo test --workspace

      - name: Check wasm32 compilation
        run: cargo build --release --target wasm32-unknown-unknown --workspace

      - name: Clippy lint
        run: cargo clippy --workspace -- -D warnings

  # ── UI: lint + build ──────────────────────────────────────────────────────
  ui:
    name: UI — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Pack hApp bundle ──────────────────────────────────────────────────────
  pack:
    name: Pack hApp
    runs-on: ubuntu-latest
    needs: [zomes, ui]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build zomes
        run: cargo build --release --target wasm32-unknown-unknown --workspace

      - name: Install holochain CLI
        run: cargo install holochain_cli --version ${{ env.HOLOCHAIN_VERSION }} --locked

      - name: Pack DNA
        run: hc dna pack dnas/autonymous/ --output dnas/autonymous/autonymous.dna

      - name: Pack hApp
        run: hc app pack . --output autonymous-me.happ

      - name: Upload hApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonymous-me-happ
          path: autonymous-me.happ
          retention-days: 30

  # ── Security audit ────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit
